<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="45%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4"/>
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="440" fill="url(#bgGrad)" rx="16"/>
  <rect width="1280" height="440" fill="url(#grid)" rx="16"/>

  <!-- Ambient Glow Circles -->
  <circle cx="150" cy="80" r="240" fill="url(#glowGrad)"/>
  <circle cx="1150" cy="360" r="260" fill="url(#glowGrad)"/>

  <!-- Circuit / Pipeline Track Graphic -->
  <g stroke="#334155" stroke-width="1.5" stroke-dasharray="4 6" fill="none" opacity="0.6">
    <path d="M 80 340 L 320 340 L 380 290 L 900 290 L 960 340 L 1200 340"/>
    <path d="M 120 100 L 400 100 L 460 150 L 820 150 L 880 100 L 1160 100"/>
  </g>

  <!-- Animated Pipeline Node Dots -->
  <circle cx="320" cy="340" r="4" fill="#38bdf8"/>
  <circle cx="380" cy="290" r="4" fill="#818cf8"/>
  <circle cx="900" cy="290" r="4" fill="#818cf8"/>
  <circle cx="960" cy="340" r="4" fill="#34d399"/>

  <!-- Main Content Container -->
  <!-- Top Category Chip -->
  <g transform="translate(640, 52)">
    <rect x="-185" y="-16" width="370" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9"/>
    <circle cx="-160" cy="0" r="5" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="-145" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="2">ENTERPRISE DEVOPS LIFECYCLE</text>
    <text x="110" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">v1.0.0</text>
  </g>

  <!-- Main Title -->
  <text x="640" y="132" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.5" filter="url(#shadow)">
    Travel Insurance Claim System
  </text>

  <!-- Gradient Subtitle -->
  <text x="640" y="174" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="url(#accentGrad)" letter-spacing="1.2">
    Continuous Integration • Automated Testing • Multi-Stage Docker • Ansible IaC
  </text>

  <!-- Tagline / Mission -->
  <text x="640" y="210" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#94a3b8" letter-spacing="0.3">
    Production-Grade MVP • Spring Boot 3.3.4 (Java 21) • Selenium WebDriver 4 • Jenkins Pipeline-as-Code
  </text>

  <!-- Tech Stack Cards Bar -->
  <g transform="translate(640, 275)">
    <!-- Card 1: Java & Spring Boot -->
    <g transform="translate(-480, 0)">
      <rect x="-80" y="-24" width="160" height="48" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
      <circle cx="-54" cy="0" r="10" fill="#ea580c" opacity="0.2"/>
      <text x="-54" y="4" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#fb923c">☕</text>
      <text x="-36" y="-3" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Java 21</text>
      <text x="-36" y="13" font-family="-apple-system, sans-serif" font-size="10" font-weight="500" fill="#94a3b8">Spring Boot 3.3</text>
    </g>

    <!-- Card 2: Jenkins -->
    <g transform="translate(-240, 0)">
      <rect x="-80" y="-24" width="160" height="48" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
      <circle cx="-54" cy="0" r="10" fill="#ef4444" opacity="0.2"/>
      <text x="-54" y="4" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#f87171">⚙️</text>
      <text x="-36" y="-3" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Jenkins CI/CD</text>
      <text x="-36" y="13" font-family="-apple-system, sans-serif" font-size="10" font-weight="500" fill="#94a3b8">Declarative Pipeline</text>
    </g>

    <!-- Card 3: Selenium -->
    <g transform="translate(0, 0)">
      <rect x="-80" y="-24" width="160" height="48" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
      <circle cx="-54" cy="0" r="10" fill="#10b981" opacity="0.2"/>
      <text x="-54" y="4" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#34d399">🧪</text>
      <text x="-36" y="-3" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Selenium 4</text>
      <text x="-36" y="13" font-family="-apple-system, sans-serif" font-size="10" font-weight="500" fill="#94a3b8">Headless Chrome</text>
    </g>

    <!-- Card 4: Docker -->
    <g transform="translate(240, 0)">
      <rect x="-80" y="-24" width="160" height="48" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
      <circle cx="-54" cy="0" r="10" fill="#0284c7" opacity="0.2"/>
      <text x="-54" y="4" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#38bdf8">🐳</text>
      <text x="-36" y="-3" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Docker</text>
      <text x="-36" y="13" font-family="-apple-system, sans-serif" font-size="10" font-weight="500" fill="#94a3b8">Multi-Stage Build</text>
    </g>

    <!-- Card 5: Ansible -->
    <g transform="translate(480, 0)">
      <rect x="-80" y="-24" width="160" height="48" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
      <circle cx="-54" cy="0" r="10" fill="#e11d48" opacity="0.2"/>
      <text x="-54" y="4" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#fb7185">📜</text>
      <text x="-36" y="-3" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Ansible IaC</text>
      <text x="-36" y="13" font-family="-apple-system, sans-serif" font-size="10" font-weight="500" fill="#94a3b8">Auto Rollback</text>
    </g>
  </g>

  <!-- Bottom Metric Highlights Bar -->
  <g transform="translate(640, 365)">
    <rect x="-560" y="-28" width="1120" height="56" rx="14" fill="#0b1329" stroke="#1e293b" stroke-width="1.2"/>

    <!-- Metric 1 -->
    <g transform="translate(-420, 0)">
      <text x="0" y="-4" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" fill="#38bdf8">15 / 15</text>
      <text x="0" y="14" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#64748b" letter-spacing="1">TASKS VERIFIED</text>
    </g>
    <line x1="-300" y1="-14" x2="-300" y2="14" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Metric 2 -->
    <g transform="translate(-160, 0)">
      <text x="0" y="-4" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" fill="#34d399">100% PASS</text>
      <text x="0" y="14" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#64748b" letter-spacing="1">13/13 TEST SUITE</text>
    </g>
    <line x1="-20" y1="-14" x2="-20" y2="14" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Metric 3 -->
    <g transform="translate(140, 0)">
      <text x="0" y="-4" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" fill="#a78bfa">&lt; 60 SEC</text>
      <text x="0" y="14" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#64748b" letter-spacing="1">AUTO ROLLBACK</text>
    </g>
    <line x1="280" y1="-14" x2="280" y2="14" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Metric 4: Author Tag -->
    <g transform="translate(420, 0)">
      <text x="0" y="-4" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">Hasnain Khan</text>
      <text x="0" y="14" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#64748b" letter-spacing="1">ROLL: 23102A0075 • VIT</text>
    </g>
  </g>
</svg>
